<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020403">
  <title>ออฟไลน์ · OBIX Config Doctor</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Sarabun",sans-serif;background:#020403;color:#e4edf2}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#09251c 0,transparent 55%),#020403}
    main{width:min(100%,520px);padding:clamp(24px,6vw,40px);border:1px solid #244236;border-radius:22px;background:rgba(8,17,15,.96);box-shadow:0 18px 60px #0008;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;border:1px solid #236344;color:#42e69a;font-size:30px}
    h1{font-size:clamp(22px,5vw,30px);margin:0 0 10px}p{color:#aebfc7;line-height:1.7;margin:0 0 18px}
    button{min-height:46px;padding:0 20px;border:0;border-radius:12px;background:#10c47a;color:#03110b;font:700 15px system-ui,sans-serif;cursor:pointer}
    button:focus-visible{outline:3px solid #9cf4ce;outline-offset:3px}.note{font-size:13px;margin-top:16px;color:#8295a2}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✈</div>
    <h1>ขณะนี้ออฟไลน์</h1>
    <p>เชื่อมต่ออินเทอร์เน็ตอีกครั้งเพื่อเปิดเครื่องมือและข้อมูลวิเคราะห์ หน้าเครื่องมือไม่ได้ถูกเก็บไว้แบบออฟไลน์เพื่อปกป้องข้อมูลและโทเคนเซสชันของคุณ</p>
    <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    <p class="note">ไฟล์คำนวณและข้อมูลส่วนตัวของคุณไม่ได้ถูกส่งหรือบันทึกจากหน้านี้</p>
  </main>
</body>
</html>
