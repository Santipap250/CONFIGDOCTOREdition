{# Shared desktop navigation. Mobile navigation is provided by bottom_nav.html. #}
<header class="workspace-header" role="banner">
  <a class="workspace-brand" href="{{ url_for('tools_static.landing') }}" aria-label="CONFIGDOCTOR Edition — หน้าหลัก">
    <svg class="workspace-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <path d="M20 2.5 35.2 11v18L20 37.5 4.8 29V11L20 2.5Z" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="1.5"/>
      <path d="M24.8 13.5a8 8 0 1 0 0 13M15.2 13.5a8 8 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="2.2" fill="currentColor"/>
    </svg>
    <span class="workspace-wordmark"><strong>CONFIGDOCTOR</strong><small>Edition</small></span>
  </a>
  <nav class="workspace-links" aria-label="เมนูหลัก">
    <a data-workspace-link="home" data-label-th="หน้าหลัก" data-label-en="Home" href="{{ url_for('tools_static.landing') }}"{% if nav_page == 'landing' %} aria-current="page"{% endif %}>Home</a>
    <a data-workspace-link="tools" data-label-th="เครื่องมือ" data-label-en="Tools" href="{{ url_for('tools_static.landing') }}#tools"{% if nav_page not in ['landing', 'analyze', 'about', 'team', 'changelog', 'downloads', 'fpv', 'fpv_gear'] %} aria-current="page"{% endif %}>Tools</a>
    <a data-workspace-link="analyze" data-label-th="วิเคราะห์" data-label-en="Analyze" href="{{ url_for('tools_analysis.index') }}"{% if nav_page == 'analyze' %} aria-current="page"{% endif %}>Analyze</a>
    <a data-workspace-link="saved" data-label-th="บันทึกไว้" data-label-en="Saved" href="{{ url_for('tools_static.landing') }}#saved">Saved</a>
    <details class="workspace-more"{% if nav_page in ['about', 'team', 'changelog', 'downloads', 'fpv', 'fpv_gear'] %} data-current="true"{% endif %}>
      <summary data-label-th="เพิ่มเติม" data-label-en="More">More</summary>
      <div class="workspace-more-menu" aria-label="แหล่งข้อมูลเพิ่มเติม">
        <a href="{{ url_for('tools_static.fpv_hub') }}">FPV Knowledge Hub</a>
        <a href="{{ url_for('tools_gear.fpv_gear') }}">FPV Gear Guide</a>
        <a href="{{ url_for('downloads.downloads_index') }}">Downloads</a>
        <a href="{{ url_for('content_pages.about') }}">About</a>
        <a href="{{ url_for('content_pages.team') }}">Team</a>
        <a href="{{ url_for('content_pages.changelog') }}">Changelog</a>
        <div class="workspace-pref-controls" role="group" aria-label="ตั้งค่าการแสดงผล">
          <button type="button" class="workspace-pref-button" data-theme-toggle aria-pressed="false">ธีม: มืด</button>
          <button type="button" class="workspace-pref-button" data-language-toggle aria-pressed="false">ภาษาเมนู: ไทย</button>
        </div>
      </div>
    </details>
  </nav>
</header>
